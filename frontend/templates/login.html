{% extends "base.html" %}
{% block title %}Log in — PalmStory AI{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="muted" style="margin-bottom:20px">Log in to see your reading history.</p>
    {% if error %}<div class="disclaimer" style="background:#fbeaec;color:#8f2d3a;margin-bottom:16px">{{ error }}</div>{% endif %}
    <form action="/login" method="post" novalidate>
      <input type="hidden" name="csrf" value="{{ csrf_token }}" />
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" value="{{ email or '' }}" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="********" required />
      </div>
      <button class="btn primary block lg" type="submit">Log in</button>
    </form>
    <p class="swap">New here? <a href="/register">Create an account</a></p>
  </div>
</div>
{% endblock %}
